<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b1e2d">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="style.css?v=1.0.17">
<title>大須大道町人祭 NOW</title>
</head>
<body>
<header class="appbar">
  <div><div class="eyebrow">第47回</div><h1>大須大道町人祭 <span>NOW</span></h1><div class="dates">10/9(金) 前夜祭　10/10(土)・11(日)</div></div>
</header>
<main>
<section id="home" class="page active">
  <div class="now-head"><div><div class="eyebrow">いま大須で</div><h2 id="nowClock">--:--</h2></div><div id="nowDate" class="now-date">----</div></div>
  <div id="nowSection"></div>
  <section id="nextWatchSection" class="next-watch-section"></section>
  <div class="section-title"><h2>今日のタイムライン</h2><button id="refreshBtn" class="text-btn">↻ 更新</button></div>
  <div id="todayList" class="event-list"></div>
  <div class="app-version">v1.0.17</div>
</section>
<section id="schedule" class="page">
  <div class="section-head"><h2>タイムテーブル</h2></div>
  <div class="schedule-filters">
    <label>日付<select id="dateFilter"><option value="">すべての日</option><option value="2026-10-09">10/9(金)</option><option value="2026-10-10">10/10(土)</option><option value="2026-10-11">10/11(日)</option></select></label>
    <label>会場<select id="venueFilter"><option value="">すべての会場</option></select></label>
  </div>
  <div id="scheduleList" class="event-list"></div>
</section>
<section id="venues" class="page"><div class="section-head"><h2>会場</h2></div><div class="hint">会場が多いので地図で位置関係を確認できます。移動ルートではなく、各会場の場所を見るための地図です。</div><div id="venueMap" class="venue-map"></div><div id="routeStatus" class="route-status" aria-live="polite"></div><div id="venueList" class="venue-list"></div></section>
<section id="search" class="page">
  <div class="section-head"><h2>検索</h2></div>
  <div class="search-tabs" role="tablist" aria-label="検索対象">
    <button type="button" class="search-tab active" data-search-tab="events" role="tab" aria-selected="true">イベント検索</button>
    <button type="button" class="search-tab" data-search-tab="performers" role="tab" aria-selected="false">出演者検索</button>
  </div>
  <div id="eventSearchPanel" class="search-panel">
  <div class="search-filters">
    <label>ジャンル<select id="searchGenre"><option value="">すべて</option></select></label>
    <label>タグ<select id="searchTag"><option value="">すべて</option></select></label>
    <label class="search-keyword">キーワード<input id="searchKeyword" type="search" placeholder="出演者・演目名など"></label>
    <div class="search-actions"><button id="searchClear" type="button" class="text-btn">条件をクリア</button></div>
  </div>
  <div id="searchSummary" class="search-summary"></div>
  <div id="searchList" class="event-list"></div>
  </div>
  <div id="performerSearchPanel" class="search-panel" hidden>
    <div class="search-filters">
      <label class="search-keyword">出演者名・ジャンル<input id="searchPerformerKeyword" type="search" placeholder="出演者名など"></label>
      <label>ジャンル<select id="searchPerformerGenre"><option value="">すべて</option></select></label>
      <label>タグ<select id="searchPerformerTag"><option value="">すべて</option></select></label>
      <div class="search-actions"><button id="searchPerformerClear" type="button" class="text-btn">条件をクリア</button></div>
    </div>
    <div id="searchPerformerSummary" class="search-summary"></div>
    <div id="searchPerformerList" class="performer-list"></div>
  </div>
</section>
<section id="favorites" class="page"><div class="section-head"><h2>お気に入り</h2></div><div id="favoriteList" class="event-list"></div></section>
</main>
<nav class="bottom-nav"><button class="nav active" data-page="home">●<span>NOW</span></button><button class="nav" data-page="schedule">◷<span class="long-label">タイムテーブル</span></button><button class="nav" data-page="venues">⌖<span>会場</span></button><button class="nav" data-page="search">🔎<span>検索</span></button><button class="nav" data-page="favorites">★<span>お気に入り</span></button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module" src="app.js?v=1.0.17"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body></html>
