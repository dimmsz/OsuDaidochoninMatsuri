<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b1e2d">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>出演者 | 大須大道町人祭</title>
</head>
<body>
<header class="appbar">
  <div>
    <div class="eyebrow">第47回</div>
    <h1>大須大道町人祭 <span>出演者</span></h1>
    <div class="dates">10/9(金) 前夜祭　10/10(土)・11(日)</div>
  </div>
</header>
<main class="performers-page">
  <div class="page-link-row">
    <a class="back-link" href="./">← イベントへ戻る</a>
  </div>
  <section id="performerIndex">
    <div class="section-head">
      <div>
        <div class="eyebrow dark">出演者マスター</div>
        <h2>出演者一覧</h2>
      </div>
      <div id="performerCount" class="search-summary"></div>
    </div>
    <div class="performer-filters">
      <label class="search-keyword">出演者名<input id="performerKeyword" type="search" placeholder="出演者を検索"></label>
      <label>ジャンル<select id="performerGenre"><option value="">すべて</option></select></label>
    </div>
    <div id="performerList" class="performer-list"></div>
  </section>

  <section id="performerDetail" class="performer-detail" hidden>
    <button id="performerBack" class="text-btn performer-back" type="button">← 出演者一覧</button>
    <div id="performerProfile"></div>
    <div class="section-title"><h2>出演スケジュール</h2></div>
    <div id="performerSchedule" class="event-list"></div>
  </section>
</main>
<script type="module" src="performers.js"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
